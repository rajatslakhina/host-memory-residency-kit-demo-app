name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # The cheapest honest substitute for a human opening this project: it proves
    # the remote package genuinely resolves from GitHub at the pinned version,
    # and that the app compiles against it.
    name: macOS · resolve remote package + build for iOS Simulator
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Swift package dependencies
        run: xcodebuild -resolvePackageDependencies -project Demo.xcodeproj -scheme Demo

      - name: Show resolved versions
        run: cat Demo.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

      # `generic/platform=iOS Simulator` rather than a named device on purpose:
      # pinning to `name=iPhone 16` ties this job to whichever simulator runtimes
      # happen to be installed on that day's runner image, and a compile-only
      # check needs no device to exist.
      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -project Demo.xcodeproj \
            -scheme Demo \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
